name: Build Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache OpenCV SDK
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: app/build/opencv-sdk
          key: ${{ runner.os }}-opencv-${{ hashFiles('gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-opencv-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Pre-setup OpenCV SDK
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: ./gradlew :app:setupOpenCV

      - name: Build with Gradle
        env:
          BAIDU_API_KEY_DEBUG: ${{ secrets.BAIDU_API_KEY_DEBUG }}
        run: ./gradlew assembleDebug

      - name: Find all APK paths
        run: |
          APK_PATHS=$(find app/build -type f -name "*.apk")
          if [ -z "$APK_PATHS" ]; then
            echo "Error: No APK files found!"
            exit 1
          fi
          
          echo "Found APKs:"
          echo "$APK_PATHS"
          
          {
            echo 'APK_PATHS<<EOF'
            echo "$APK_PATHS"
            echo 'EOF'
          } >> $GITHUB_ENV

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: ${{ env.APK_PATHS }}
